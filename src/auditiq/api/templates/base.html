<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}AuditIQ{% endblock %}</title>
  <link rel="stylesheet" href="/static/vendor/pico.min.css">
  <script src="/static/vendor/htmx.min.js"></script>
  <style>
    .stepper { display: flex; gap: .4rem; flex-wrap: wrap; list-style: none; padding-left: 0; margin-top: .5rem; }
    .stepper li { padding: .2rem .6rem; border-radius: 1rem; background: #eef; font-size: .82rem; }
    .stepper li.done { background: #d1e7dd; }
    .tabbar { display: flex; gap: .25rem; flex-wrap: wrap; list-style: none; padding-left: 0; border-bottom: 1px solid #ccc; }
    .tabbar li a { display: inline-block; padding: .35rem .8rem; text-decoration: none; color: #333; cursor: pointer; border-radius: .4rem .4rem 0 0; }
    .tabbar li a:hover { background: #eee; }
    .chip { display: inline-block; padding: .05rem .45rem; margin: .05rem; border: 1px solid #aaa; border-radius: .8rem; font-size: .72rem; background: #fff; cursor: default; }
    button.chip { cursor: pointer; }
    .inl { display: inline-flex; gap: .35rem; align-items: center; margin: 0; }
    .inl input { width: auto; padding: .2rem .4rem; font-size: .8rem; margin: 0; }
    .inl button { padding: .2rem .6rem; font-size: .8rem; margin: 0; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }
    .alert { color: #842029; background: #f8d7da; padding: .5rem .75rem; border-radius: .4rem; margin: .5rem 0; }
    .ok { color: #0f5132; background: #d1e7dd; padding: .5rem .75rem; border-radius: .4rem; margin: .5rem 0; }
    .muted { color: #666; font-size: .82rem; }
    .severity-material { color: #842029; font-weight: 600; }
    .severity-watch { color: #664d03; }
    .severity-minor { }
    .severity-rounding, .severity-none { color: #0f5132; margin-top: 3rem; }
    details.drawer { font-size: .8rem; }
    details.drawer summary { color: #06f; cursor: pointer; }
  </style>
</head>
<body>
<main class="container">
{% block content %}{% endblock %}
</main>
</body>
</html>
