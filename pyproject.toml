[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auditiq"
version = "0.1.0"
description = "AuditIQ Core — trial balance ingestion, financial statement reconciliation and review"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
# Full FSLI mapping cascade (embedding layer)
mapping = ["sentence-transformers>=2.6", "scikit-learn>=1.3", "numpy>=1.24"]
# PDF financial-statement / published-report ingestion
report = ["pymupdf>=1.24", "pdfplumber>=0.11"]
# Optional LLM-assisted mapping layer
llm = ["openai>=1.30"]
# Web harness: JSON API + server-rendered UI (auditiq serve)
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "jinja2>=3.1"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
auditiq = "auditiq.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
